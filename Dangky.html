<body>
    <h1 align="center" > Đăng Ký Thành Viên  </h1>
  <form action="#" method="post" name="dangky">
    <fieldset>
      <legend><b>Thông tin cá nhân</b></legend>
      <table>
        <tr>
          <td>Họ và tên:</td>
          <td><input type="text" name="hoten" required></td>
        </tr>
        <tr>
          <td>Ngày sinh:</td>
          <td>
            <select name="ngay">
              <option value="01" selected>01</option>
              <option value="02">02</option>
              <option value="03">03</option>
              <option value="04">04</option>
              <option value="05">05</option>
              <option value="06">06</option>
              <option value="07">07</option>
              <option value="08">08</option>
              <option value="09">09</option>
              <option value="10">10</option>
              <option value="11">11</option>
              <option value="12">12</option>
              <option value="13">13</option>
              <option value="14">14</option>
              <option value="15">15</option>
              <option value="16">16</option>
              <option value="17">17</option>
              <option value="18">18</option>
              <option value="19">19</option>
              <option value="20">20</option>
              <option value="21">21</option>
              <option value="22">22</option>
              <option value="23">23</option>
              <option value="24">24</option>
              <option value="25">25</option>
              <option value="26">26</option>
              <option value="27">27</option>
              <option value="28">28</option>
              <option value="29">29</option>
              <option value="30">30</option>
              <option value="31">31</option>
            </select>
            Tháng
            <select name="thang">
              <option value="01" selected>01</option>
              <option value="02">02</option>
              <option value="03">03</option>
              <option value="04">04</option>
              <option value="05">05</option>
              <option value="06">06</option>
              <option value="07">07</option>
              <option value="08">08</option>
              <option value="09">09</option>
              <option value="10">10</option>
              <option value="11">11</option>
              <option value="12">12</option>
            </select>
            Năm
            <input type="text" name="nam" size="4">
          </td>
        </tr>
        <tr>
          <td>Giới tính:</td>
          <td>
            <input type="radio" name="radGioiTinh" value="Nam" checked> Nam
            <input type="radio" name="radGioiTinh" value="Nữ"> Nữ
          </td>
        </tr>
        <tr>
          <td>Địa chỉ:</td>
          <td><textarea name="diachi" rows="3" cols="25"></textarea></td>
        </tr>
        <tr>
          <td>Điện thoại:</td>
          <td><input type="tel" name="dienthoai"></td>
        </tr>
        <tr>
          <td>Email:</td>
          <td><input type="email" name="email" required></td>
        </tr>
      </table>
    </fieldset>

    <fieldset>
      <legend><b>Thông tin đăng nhập</b></legend>
      <table>
        <tr>
          <td>Tên đăng nhập:</td>
          <td><input type="text" name="tendangnhap" required></td>
        </tr>
        <tr>
          <td>Mật khẩu:</td>
          <td><input type="password" name="matkhau" required></td>
        </tr>
        <tr>
          <td>Nhập lại mật khẩu:</td>
          <td><input type="password" name="nhaplaimatkhau" required></td>
        </tr>
        <tr>
          <td colspan="2" align="center">
            <input type="submit" value="Đăng ký">
            <input type="reset" value="Hủy">
          </td>
        </tr>
      </table>
    </fieldset>
  </form>
</body>
</html>
